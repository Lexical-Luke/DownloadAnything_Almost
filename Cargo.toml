[package]
name = "download-anything"
version = "3.1.0"
edition = "2024"
description = "Download MP3s and MP4s from almost any site. A tiny GUI for yt-dlp."

[dependencies]
arboard = "3.7.0"
eframe = "0.37.0"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }

[profile.release]
strip = true
lto = true

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder", "NSRunningApplication"] }
